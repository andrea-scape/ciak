<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Adwaita Slate Gradients -->
    <linearGradient id="slate-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b3b3b"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>

    <linearGradient id="slate-stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#464646"/>
      <stop offset="100%" stop-color="#303030"/>
    </linearGradient>

    <!-- Adwaita Blue Gradient (#3584e4 family) -->
    <linearGradient id="adwaita-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>

    <!-- Adwaita Emerald Green Gradient (#26a269 family) -->
    <linearGradient id="emerald-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ec27e"/>
      <stop offset="100%" stop-color="#1e7852"/>
    </linearGradient>

    <!-- Clip Path for Clapper Stick Stripes -->
    <clipPath id="top-stick-clip">
      <rect x="12" y="16" width="104" height="18" rx="5"/>
    </clipPath>
  </defs>

  <!-- Scaled Group targeting ~70% total canvas coverage -->
  <g transform="translate(64, 64) scale(1.025) translate(-64, -60)">

    <!-- MAIN CLAPPERBOARD BASE -->
    <g>
      <!-- Base 3D Bottom Extrusion Slab -->
      <rect x="12" y="44" width="104" height="68" rx="12" fill="#202020"/>

      <!-- Base Front Face -->
      <rect x="12" y="38" width="104" height="68" rx="12" fill="url(#slate-body)"/>

      <!-- Top 1px Light Rim Highlight -->
      <path d="M 24 38.5 L 104 38.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.10" stroke-linecap="round"/>

      <!-- Ultra-Softened Bottom Rim Separation Line -->
      <path d="M 24 106 L 104 106" stroke="#000000" stroke-width="1" stroke-opacity="0.05" stroke-linecap="round"/>

      <!-- SUBTLE DARKENED PLACEHOLDER LINES -->
      <g>
        <rect x="24" y="54" width="52" height="6" rx="3" fill="#000000" fill-opacity="0.22"/>
        <rect x="24" y="68" width="38" height="6" rx="3" fill="#000000" fill-opacity="0.22"/>
        <rect x="24" y="82" width="24" height="6" rx="3" fill="#000000" fill-opacity="0.22"/>
      </g>

      <!-- TILTED TOP CLAPPER STICK -->
      <g transform="rotate(-8 12 34)">
        <!-- Stick 3D Bottom Extrusion -->
        <rect x="12" y="19" width="104" height="17" rx="5" fill="#222222"/>

        <!-- Main Stick Front Face -->
        <rect x="12" y="16" width="104" height="17" rx="5" fill="url(#slate-stick)"/>

        <!-- Adwaita Blue Stripes -->
        <g clip-path="url(#top-stick-clip)">
          <path d="M 20 8 L 36 8 L 22 38 L 6 38 Z" fill="url(#adwaita-blue)"/>
          <path d="M 44 8 L 60 8 L 46 38 L 30 38 Z" fill="url(#adwaita-blue)"/>
          <path d="M 68 8 L 84 8 L 70 38 L 54 38 Z" fill="url(#adwaita-blue)"/>
          <path d="M 92 8 L 108 8 L 94 38 L 78 38 Z" fill="url(#adwaita-blue)"/>
          <path d="M 116 8 L 132 8 L 118 38 L 102 38 Z" fill="url(#adwaita-blue)"/>
        </g>

        <!-- Hinge Pin -->
        <circle cx="20" cy="25" r="3" fill="#ffffff" opacity="0.15"/>

        <!-- Top Rim Light Highlight -->
        <path d="M 17 16.5 L 111 16.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.10" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 2D TRACKER BADGE -->
    <g>
      <!-- Flat Base Badge -->
      <circle cx="94" cy="94" r="22" fill="url(#emerald-badge)"/>

      <!-- Flat Rim Stroke -->
      <circle cx="94" cy="94" r="21.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Flat White Checkmark Icon -->
      <path d="M 83 94 L 90 101 L 105 85" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
