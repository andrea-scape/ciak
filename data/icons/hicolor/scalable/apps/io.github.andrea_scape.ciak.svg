<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Drop Shadow for GNOME 2.5D Elevation -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    
    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Adwaita Slate Gradients -->
    <linearGradient id="slate-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>

    <linearGradient id="slate-stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#303030"/>
    </linearGradient>

    <!-- Adwaita Blue Gradient (#3584e4 family) -->
    <linearGradient id="adwaita-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>

    <!-- Adwaita Emerald Green Gradient (#26a269 family) -->
    <linearGradient id="emerald-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ec27e"/>
      <stop offset="100%" stop-color="#1e7852"/>
    </linearGradient>

    <!-- Clip Path for Clapper Stick Stripes -->
    <clipPath id="top-stick-clip">
      <rect x="12" y="16" width="104" height="18" rx="5"/>
    </clipPath>
  </defs>

  <!-- Main Clapperboard Group with Elevation Shadow -->
  <g filter="url(#shadow)">
    <!-- Clapperboard Base Body (Dimensione corretta GNOME: 104px di larghezza) -->
    <rect x="12" y="38" width="104" height="74" rx="12" fill="url(#slate-body)"/>
    
    <!-- Top Light Edge Highlight (GNOME 1px Top Rim) -->
    <path d="M 24 38.5 L 104 38.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>

    <!-- Content Placeholder Lines (UI Inset) -->
    <rect x="24" y="52" width="52" height="7" rx="3.5" fill="#1e1e1e" opacity="0.6"/>
    <rect x="24" y="66" width="38" height="7" rx="3.5" fill="#1e1e1e" opacity="0.6"/>
    <rect x="24" y="80" width="26" height="7" rx="3.5" fill="#1e1e1e" opacity="0.6"/>

    <!-- Tilted Top Clapper Stick -->
    <g transform="rotate(-8 12 34)">
      <!-- Main Stick Frame -->
      <rect x="12" y="16" width="104" height="18" rx="5" fill="url(#slate-stick)"/>
      
      <!-- Strisce Uniformi Solo Blue Adwaita -->
      <g clip-path="url(#top-stick-clip)">
        <path d="M 20 8 L 36 8 L 22 38 L 6 38 Z" fill="url(#adwaita-blue)"/>
        <path d="M 44 8 L 60 8 L 46 38 L 30 38 Z" fill="url(#adwaita-blue)"/>
        <path d="M 68 8 L 84 8 L 70 38 L 54 38 Z" fill="url(#adwaita-blue)"/>
        <path d="M 92 8 L 108 8 L 94 38 L 78 38 Z" fill="url(#adwaita-blue)"/>
        <path d="M 116 8 L 132 8 L 118 38 L 102 38 Z" fill="url(#adwaita-blue)"/>
      </g>

      <!-- Hinge Hardware -->
      <circle cx="20" cy="25" r="3" fill="#ffffff" opacity="0.3"/>
      
      <!-- Top Rim Lighting for Stick -->
      <path d="M 17 16.5 L 111 16.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Elevated Tracker Badge (Bottom Right) -->
  <g filter="url(#badge-shadow)">
    <circle cx="94" cy="94" r="23" fill="url(#emerald-badge)"/>
    
    <!-- Rim Lighting for Badge -->
    <circle cx="94" cy="94" r="22.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>
    
    <!-- White Checkmark Icon -->
    <path d="M 83 94 L 90 101 L 105 85" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
